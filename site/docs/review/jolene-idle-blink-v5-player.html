<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dolly idle + blink private QA proof</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3eee5;color:#111713;font-family:ui-monospace,monospace}.shell{width:min(96vw,780px);border:1px solid #111713;background:#fffaf1}.head{display:flex;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #111713}.head strong{letter-spacing:.08em}.head span{font-size:9px;color:#667067}.stage{height:560px;display:grid;place-items:end center;background:#0b100d;overflow:auto}.stage canvas{width:320px;height:460px;image-rendering:pixelated}.stage[data-zoom="2"]{height:1020px}.stage[data-zoom="2"] canvas{width:640px;height:920px}.controls{display:flex;gap:8px;padding:12px 18px;border-top:1px solid #111713}.controls button{min-height:40px;padding:0 14px;border:1px solid #111713;background:#fffaf1;font:700 10px ui-monospace,monospace}.note{padding:0 18px 16px;color:#667067;font:10px/1.5 system-ui,sans-serif}</style></head><body><main class="shell"><header class="head"><strong>PORT-AVATAR-005.7B · APPROVED REVIEW</strong><span>APPROVED · LOOPS <b data-loops>0</b></span></header><section class="stage" data-zoom="1"><canvas width="320" height="460"></canvas></section><div class="controls"><button type="button" data-play>Pause</button><button type="button" data-zoom>View exact 2×</button></div><p class="note">Eleven frames with exact reversed reuse. Approved v2 OPEN/HALF/CLOSED face pixels are locked. Native 320×460, 440 px character height, y=448 anchor, no transforms. Let this run for five or more loops.</p></main><script>const durations=[600,320,280,360,280,320,700,70,85,70,600];const canvas=document.querySelector('canvas');const context=canvas.getContext('2d');context.imageSmoothingEnabled=false;const image=new Image();image.src='./jolene-idle-blink-v5-atlas-1x.png';let frame=0;let loops=0;let playing=true;let timer;function draw(){context.clearRect(0,0,320,460);context.drawImage(image,frame*320,0,320,460,0,0,320,460)}function next(){clearTimeout(timer);if(!playing)return;timer=setTimeout(()=>{frame=(frame+1)%durations.length;if(frame===0){loops+=1;document.querySelector('[data-loops]').textContent=String(loops)}draw();next()},durations[frame])}image.addEventListener('load',()=>{draw();next()});document.querySelector('[data-play]').addEventListener('click',event=>{playing=!playing;event.currentTarget.textContent=playing?'Pause':'Play';next()});document.querySelector('[data-zoom]').addEventListener('click',event=>{const stage=document.querySelector('.stage');const zoom=stage.dataset.zoom==='1'?'2':'1';stage.dataset.zoom=zoom;event.currentTarget.textContent=zoom==='1'?'View exact 2×':'View native 1×'});</script></body></html>
