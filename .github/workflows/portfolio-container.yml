name: Portfolio container

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify repository security configuration
        run: node site/scripts/check-repository-security.mjs

      - name: Build portfolio image
        run: docker build --tag carl-welch-portfolio:ci site

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: carl-welch-portfolio:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          timeout: 10m

      - name: Start hardened container
        run: >-
          docker run --detach --name portfolio-ci --publish 3000:3000
          --read-only --tmpfs /tmp:size=64m,mode=1777 --cap-drop ALL
          --security-opt no-new-privileges:true carl-welch-portfolio:ci

      - name: Wait for container health
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' portfolio-ci)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs portfolio-ci
              exit 1
            fi
            sleep 2
          done
          docker logs portfolio-ci
          exit 1

      - name: Verify runtime boundary
        run: |
          test "$(docker exec portfolio-ci id -u)" = "1000"
          docker exec portfolio-ci test ! -e /app/.env
          docker exec portfolio-ci test ! -e /app/.env.local
          node site/scripts/check-container.mjs

      - name: Show logs on failure
        if: failure()
        run: docker logs portfolio-ci

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Vercel Next.js runtime
        env:
          NEXT_PUBLIC_SITE_URL: https://carl-welch-portfolio.vercel.app
        run: pnpm build:vercel

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify release-readiness register
        run: pnpm check:release-readiness

      - name: Run browser regression suite
        run: pnpm check:browser

      - name: Verify Jolene capability states
        run: pnpm check:jolene-ui

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-playwright-report
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7
